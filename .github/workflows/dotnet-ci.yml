name: .NET CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'

jobs:
  preflight-validation:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run repository pre-checks
        shell: pwsh
        run: |
          ./.github/scripts/check-mojibake.ps1 -RepoRoot $PWD -FirstMatchPerFile

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: preflight-validation

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TITANIC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=titanic_test_db;Username=postgres;Password=postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Titanic.sln

      - name: Build solution
        run: dotnet build Titanic.sln --configuration Release --no-restore --nologo

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test Titanic.Test/Titanic.Test.csproj `
            --configuration Release `
            --no-build `
            --nologo `
            --results-directory "Titanic.Test/TestResults" `
            --logger "trx;LogFileName=test-results.trx"

          [xml]$trx = Get-Content "Titanic.Test/TestResults/test-results.trx"
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $skipped = [int]$counters.notExecuted

          Write-Host "Parsed test summary: Total=$total; Passed=$passed; Failed=$failed; Skipped=$skipped"

          if ($skipped -gt 0) {
            Write-Host "::warning::Test run contains skipped tests: $skipped"
          } else {
            Write-Host "No skipped tests detected."
          }

