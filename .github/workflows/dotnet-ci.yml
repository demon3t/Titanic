name: .NET CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'

jobs:
  repository-smell-check:
    name: Repository smell check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository smell check
        shell: pwsh
        run: ./.github/scripts/check-mojibake.ps1 -RepoRoot $PWD -FirstMatchPerFile

  build-and-test:
    needs: repository-smell-check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TITANIC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=titanic_test_db;Username=postgres;Password=postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Titanic.sln

      - name: Build solution
        run: dotnet build Titanic.sln --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet test Titanic.Test/Titanic.Test.csproj --configuration Release --no-build --nologo
